<!DOCTYPE html>
<html>
<head>
    <title>Abaqus INP Drawing Tool</title>
    <style>
        canvas {
            border: 1px solid #000;
            margin: 10px;
        }
        .tools {
            margin: 10px;
        }
        button {
            padding: 5px 15px;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="tools">
        <button onclick="setTool('line')">Line</button>
        <button onclick="setTool('rectangle')">Rectangle</button>
        <button onclick="exportINP()">Export to .inp</button>
    </div>
    <canvas id="canvas" width="800" height="600"></canvas>
    <a id="downloadLink" style="display: none"></a>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentTool = 'line';
        let startX, startY;
        let shapes = [];
        let vertices = []
        
        

        // Tools configuration
        function setTool(tool) {
            currentTool = tool;
            // document.querySelectorAll('.tools button').forEach(btn => btn.classList.remove('active'));
            // document.getElementById(tool + 'Btn').classList.add('active');
        }

        function drawVertices(shape) {
            ctx.fillStyle = '#ff0000'; // Красный цвет
            let points = [];
            
            if(shape.type === 'line') {
                points = [
                    {x: shape.x1, y: shape.y1},
                    {x: shape.x2, y: shape.y2}
                ];
            } else if(shape.type === 'rectangle') {
                const minX = Math.min(shape.x1, shape.x2);
                const maxX = Math.max(shape.x1, shape.x2);
                const minY = Math.min(shape.y1, shape.y2);
                const maxY = Math.max(shape.y1, shape.y2);
                
                points = [
                    {x: minX, y: minY},
                    {x: maxX, y: minY},
                    {x: maxX, y: maxY},
                    {x: minX, y: maxY}
                ];
            }
            
            points.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
                ctx.fill();
                // vertices.push(point)
            });
        }

        function drawShape(shape) {
            ctx.beginPath();
            if(shape.type === 'line') {
                ctx.moveTo(shape.x1, shape.y1);
                ctx.lineTo(shape.x2, shape.y2);
            } else if(shape.type === 'rectangle') {
                const width = shape.x2 - shape.x1;
                const height = shape.y2 - shape.y1;
                ctx.rect(shape.x1, shape.y1, width, height);
            }
            ctx.stroke();
            
            // Отрисовка вершин
            drawVertices(shape);
        }

        function addVertices(shape) {
            switch (shape.type) {
                case 'line':
                    vertices.push({x: shape.x1, y: shape.y1});
                    vertices.push({x: shape.x2, y: shape.y2});
                    break;
            
                default:
                    console.log('incorrect shape.type:', shape.type);
                    break;
            }
        }
        // Drawing logic
        canvas.onmousedown = (e) => {
            isDrawing = true;
            startX = e.offsetX;
            startY = e.offsetY;
        };

        canvas.onmousemove = (e) => {
            if (!isDrawing) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Redraw all shapes
            shapes.forEach(shape => {
                drawShape(shape);
            });
            
            // Draw current shape
            ctx.beginPath();
            if(currentTool === 'line') {
                ctx.moveTo(startX, startY);
                ctx.lineTo(e.offsetX, e.offsetY);
            } else if(currentTool === 'rectangle') {
                ctx.rect(startX, startY, e.offsetX - startX, e.offsetY - startY);
            }
            ctx.stroke();

        };

        canvas.onmouseup = (e) => {
            isDrawing = false;
            const shape = {
                type: currentTool,
                x1: startX,
                y1: startY,
                x2: e.offsetX,
                y2: e.offsetY
            };
            shapes.push(shape);
            addVertices(shape);
            drawShape(shape);
        };

        // Export to INP
        // No Assembly module
        function exportINP() {
            console.log(vertices.length)

            vertices.forEach(point => {
                console.log(point.x, point.y)
            });
            // return;
            let center_x = canvas.width / 2;
            let center_y = canvas.height /2;

            let inpContent = '*Heading\n** Job name: Job-1 Model name: Model-1\n** Generated by: Abaqus/CAE 2023\n';
            
            inpContent += '*Preprint, echo=NO, model=NO, history=NO, contact=NO\n';

            inpContent += '**\n** PARTS\n**\n';

            inpContent += '*Part, name=Part-1\n';

            // Nodes section
            let inpNodes = '*Node\n';
            let inpElem = '*Element, type=T2D2\n';
            let elemId = 1;
            let nodeId = 1;

            shapes.forEach(shape => {
                switch (shape.type) {
                    case 'line':
                        inpElem += elemId++ + ', ' + nodeId + ', ' + (nodeId + 1) + '\n'
                        inpNodes += nodeId++ + ', ' + ((shape.x1 - center_x)) + '., ' + (-(shape.y1 - center_y)) + '.\n';
                        inpNodes += nodeId++ + ', ' + ((shape.x2 - center_x)) + '., ' + (-(shape.y2 - center_y)) + '.\n';
                        break;
                
                    default:
                        break;
                }
            });

            inpContent += inpNodes + inpElem;

            //generete set for section

            inpContent += '*Nset, nset=Set-1';

            switch (nodeId) {
                case 1:
                    console.log('empty sketch!!!!!!!');
                    return;
                    break;
                case 3:
                    inpContent += '\n 1, 2\n'
                default:
                    inpContent += ', generate\n 1, ' + (nodeId - 1) + ', 1\n';
                    break;
            }

            inpContent += '*Elset, elset=Set-1';

            switch (elemId) {
                case 1:
                    inpContent += '\n';
                    break;
                case 2:
                    inpContent += '\n 1\n';
                    break;
                case 3:
                    inpContent += '\n 1, 2\n';
                    break;
                default:
                    inpContent += ', generate\n 1, ' + (elemId - 1) + ', 1\n';
                    break;
            }

            inpContent += '** Section: Section-1\n*Solid Section, elset=Set-1, material=Material-1\n1.,\n';

            // end Part
            inpContent += '*End Part\n';

            // ASSEMBLY
            
            // Create download
            const blob = new Blob([inpContent], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const link = document.getElementById('downloadLink');
            link.href = url;
            link.download = 'drawing.inp';
            link.style.display = 'block';
            link.click();
        }
    </script>
</body>
</html>
